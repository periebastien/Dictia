name: build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (build release + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload dictia.exe
        uses: actions/upload-artifact@v7
        with:
          name: dictia-${{ github.sha }}
          path: target/release/dictia.exe
          if-no-files-found: error

  android:
    name: Android (APK + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk dictia.apk

      - name: Upload dictia.apk
        uses: actions/upload-artifact@v7
        with:
          name: dictia-android-${{ github.sha }}
          path: android/dictia.apk
          if-no-files-found: error

      # Lien fixe pour télécharger depuis le téléphone :
      # https://github.com/<dépôt>/releases/download/android-latest/dictia.apk
      - name: Publier la dernière APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dictia.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dictia Android (dernière version)" \
            --notes "APK produite automatiquement depuis la branche ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
