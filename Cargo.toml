[package]
name = "dictia"
version = "0.1.0"
edition = "2021"
description = "Dictée vocale pour Windows : raccourci global, transcription OpenAI, frappe au curseur."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
flacenc = "0.5.1"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "multipart", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simplelog = "0.12.2"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.8"
toml_edit = "0.25.17"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["net", "io-util"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
global-hotkey = "0.9.0"
raw-window-handle = "0.6.2"
tray-icon = "0.26.1"
wry = { version = "0.57.0", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
